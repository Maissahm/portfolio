<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Choose a suitcase</title>
<!-- mobile flight animation fix v2 -->

<style>
* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  min-height: 100vh;
  background: url("suitcases-bg.png") center/cover no-repeat;
  font-family: "Segoe UI", Arial, sans-serif;
  overflow-x: hidden;
}

/* ================= SCENE ================= */
.scene {
  position: relative;
  width: 100%;
  height: 100vh;
}

/* ================= OVERLAY ================= */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.15);
  pointer-events: none;
  z-index: 1;
}

/* ================= SUITCASES ================= */
.suitcase {
  position: absolute;
  z-index: 2;
  width: 200px;
  height: 150px;
  cursor: pointer;
  border-radius: 12px;
  animation: float 6s ease-in-out infinite;
  transition: transform .25s, box-shadow .25s;
}

.suitcase:hover {
  animation-play-state: paused;
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 15px 30px rgba(0,0,0,.25);
}

/* positions desktop */
#s1 { top: 5%; left: 16%; }
#s2 { top: 15%; left: 40%; }
#s3 { top: 36%; left: 70%; }
#s4 { top: 54%; left: 16%; }
#s5 { top: 73%; left: 60%; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ================= CENTER TEXT ================= */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  font-size: 28px;
  font-weight: 600;
  color: white;
  text-align: center;
  background: rgba(0,0,0,.48);
  padding: 16px 28px;
  border-radius: 14px;
  pointer-events: none;
  transition: opacity .2s ease;
  backdrop-filter: blur(4px);
}

/* ================= BACK BUTTON ================= */
.back-btn {
  position: absolute;
  z-index: 4;
  top: 20px;
  left: 20px;
  padding: 10px 18px;
  background: rgba(0,0,0,.65);
  color: white;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.2);
  cursor: pointer;
  font-size: 15px;
}

.back-btn:hover { background: rgba(0,0,0,.8); }

/* ================= MODAL ================= */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.72);
  justify-content: center;
  align-items: center;
  padding: 24px;
  backdrop-filter: blur(3px);
}

/* ================= BOARDING PASS ================= */
.ticket {
  position: relative;
  width: min(94vw, 1000px);
  aspect-ratio: 900 / 420;
  background: url("ticket-bg.png") center/100% 100% no-repeat;
  border-radius: 20px;
  overflow: hidden;
  filter: drop-shadow(0 24px 50px rgba(0,0,0,.35));
  animation: ticketIn .22s ease-out;
}

@keyframes ticketIn {
  from { transform: translateY(14px) scale(.98); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.close {
  position: absolute;
  top: 3.5%;
  right: 2.3%;
  z-index: 20;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.82);
  color: #1d2630;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 3px 12px rgba(0,0,0,.14);
  transition: transform .18s, background .18s;
}

.close:hover {
  transform: scale(1.08);
  background: #fff;
}

.ticket-title {
  position: absolute;
  left: 8.2%;
  top: 5.5%;
  width: 76%;
  color: #15212d;
  font-size: clamp(18px, 2vw, 29px);
  font-weight: 750;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ticket-section {
  position: absolute;
  left: 8.2%;
  width: 59%;
  color: #17212b;
}

.ticket-section.description {
  top: 33.2%;
  height: 11.8%;
  padding-right: 8px;
  display: flex;
  align-items: flex-start;
}

.ticket-section.description p {
  margin: 0;
  font-size: clamp(11px, 1.08vw, 14px);
  line-height: 1.42;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ticket-section.tech {
  top: 53.8%;
  height: 10%;
  display: flex;
  align-items: flex-start;
  padding-top: 4px;
}

#projectTech {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

#projectTech li {
  font-size: clamp(10px, 1.05vw, 13px);
  font-weight: 650;
  padding: 5px 10px;
  border: 1px solid rgba(35,109,155,.32);
  border-radius: 999px;
  background: rgba(255,255,255,.64);
  color: #215f87;
}

.ticket-section.demo {
  top: 75.8%;
  height: 12%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 4px;
}

#projectDemo {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.youtube-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 8px 14px;
  border-radius: 8px;
  background: #1f6f9e;
  color: white;
  text-decoration: none;
  font-size: clamp(10px, 1.05vw, 13px);
  font-weight: 700;
  box-shadow: 0 5px 12px rgba(31,111,158,.18);
  transition: transform .18s, filter .18s;
}

.youtube-btn:hover {
  transform: translateY(-2px);
  filter: brightness(.95);
}


/* ================= FLIGHT TRANSITION ================= */
.flight-layer {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: none;
  pointer-events: none;
  overflow: hidden;
}

.flight-layer.active {
  display: block;
}

.flight-shade {
  position: absolute;
  inset: 0;
  background: rgba(2, 12, 18, .28);
  backdrop-filter: blur(1.5px);
  opacity: 0;
  transition: opacity .22s ease;
}

.flight-layer.active .flight-shade {
  opacity: 1;
}

.flight-route {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

#flightPath {
  fill: none;
  stroke: rgba(255, 255, 255, .78);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 8 11;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

.flight-plane {
  position: absolute;
  left: 0;
  top: 0;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 44px;
  line-height: 1;
  text-shadow:
    0 2px 2px rgba(0,0,0,.25),
    0 0 12px rgba(47, 151, 220, .95),
    0 0 22px rgba(47, 151, 220, .55);
  opacity: 0;
  will-change: left, top, transform, opacity;
}

.flight-destination {
  position: absolute;
  left: 50%;
  top: 21%;
  transform: translate(-50%, -50%) scale(.94);
  min-width: min(78vw, 350px);
  max-width: min(84vw, 460px);
  padding: 11px 18px 12px;
  border: 1px solid rgba(255,255,255,.38);
  border-radius: 999px;
  background: rgba(5, 20, 28, .78);
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
  backdrop-filter: blur(10px);
  color: #fff;
  text-align: center;
  opacity: 0;
  transition: opacity .28s ease, transform .28s ease;
}

.flight-layer.show-destination .flight-destination {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.flight-destination span {
  display: block;
  margin-bottom: 2px;
  color: #a9dfff;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.flight-destination strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: clamp(14px, 2.4vw, 19px);
  letter-spacing: .2px;
}

.scene.flight-active .suitcase,
.scene.flight-active .center-text,
.scene.flight-active .back-btn {
  filter: saturate(.72) brightness(.72);
}

.scene.flight-active .suitcase {
  pointer-events: none;
}

.suitcase.departing {
  animation: departurePulse .46s ease both !important;
  box-shadow: 0 0 0 4px rgba(120, 205, 255, .35), 0 18px 38px rgba(0,0,0,.3);
}

@media (max-width: 768px) {
  .suitcase.departing {
    background: rgba(31,111,158,.95) !important;
    box-shadow: 0 0 0 3px rgba(169,223,255,.55), 0 16px 34px rgba(0,0,0,.35) !important;
  }
}

@keyframes departurePulse {
  0%   { transform: scale(1); }
  45%  { transform: translateY(-5px) scale(1.055); }
  100% { transform: scale(1); }
}

@media (max-width: 768px) {
  .flight-layer {
    z-index: 20000;
  }

  .flight-shade {
    background: rgba(2, 12, 18, .48);
    backdrop-filter: blur(2px);
  }

  .flight-destination {
    top: calc(92px + env(safe-area-inset-top));
    transform: translate(-50%, 0) scale(.94);
    min-width: min(86vw, 350px);
    max-width: 90vw;
    padding: 11px 15px 12px;
  }

  .flight-layer.show-destination .flight-destination {
    transform: translate(-50%, 0) scale(1);
  }

  .flight-plane {
    width: 58px;
    height: 58px;
    font-size: 50px;
    z-index: 3;
    text-shadow:
      0 3px 3px rgba(0,0,0,.35),
      0 0 14px rgba(47, 151, 220, 1),
      0 0 30px rgba(47, 151, 220, .72);
  }

  .flight-route {
    z-index: 2;
  }

  #flightPath {
    stroke-width: 3;
    stroke-dasharray: 7 9;
    stroke: rgba(255,255,255,.9);
  }
}

/* Respect reduced-motion preferences without making the transition disappear. */
@media (prefers-reduced-motion: reduce) {
  .flight-shade {
    transition: none;
  }
}

.mobile-label { display: none; }
.ticket-section[hidden] { display: none !important; }

.coming-soon {
  color: #345;
  font-weight: 650;
}

/* ================= MOBILE / TABLET ================= */
@media (max-width: 768px) {
  html, body {
    min-height: 100%;
    background: #071317;
  }

  body {
    min-height: 100svh;
    overflow-x: hidden;
  }

  /* Mobile uses a reliable project list instead of invisible click zones
     over the desktop artwork. The airport/suitcase identity is preserved. */
  .scene {
    min-height: 100svh;
    height: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding:
      calc(82px + env(safe-area-inset-top))
      18px
      calc(28px + env(safe-area-inset-bottom));
    background:
      linear-gradient(rgba(4,18,22,.56), rgba(4,18,22,.78)),
      url("suitcases-bg.png") center / cover no-repeat;
  }

  .overlay {
    position: fixed;
    background: rgba(0,0,0,.12);
  }

  .center-text {
    position: static;
    transform: none;
    width: 100%;
    margin: 0 0 8px;
    padding: 14px 16px;
    font-size: clamp(17px, 5vw, 21px);
    line-height: 1.25;
    border-radius: 16px;
    background: rgba(0,0,0,.56);
    backdrop-filter: blur(8px);
  }

  .suitcase,
  #s1, #s2, #s3, #s4, #s5 {
    position: relative;
    top: auto;
    left: auto;
    width: 100%;
    height: 70px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(10,25,30,.76);
    box-shadow: 0 10px 28px rgba(0,0,0,.2);
    color: #fff;
    animation: none;
    transform: none;
    -webkit-tap-highlight-color: transparent;
  }

  .suitcase::before {
    content: "🧳";
    flex: 0 0 auto;
    font-size: 29px;
    line-height: 1;
  }

  .suitcase::after {
    content: attr(data-title);
    min-width: 0;
    flex: 1;
    font-size: 16px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: .1px;
    white-space: normal;
  }

  .suitcase:hover,
  .suitcase:active {
    animation: none;
    transform: none;
    box-shadow: 0 10px 28px rgba(0,0,0,.2);
  }

  .suitcase:active {
    background: rgba(31,111,158,.88);
  }

  .back-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 12px;
    z-index: 30;
    min-height: 44px;
    padding: 10px 15px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }

  .modal {
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    align-items: flex-end;
    overflow: hidden;
  }

  /* Vertical boarding pass / bottom sheet on phones. */
  .ticket {
    width: 100%;
    max-width: 520px;
    aspect-ratio: auto;
    max-height: 91svh;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background:
      linear-gradient(rgba(247,243,233,.96), rgba(247,243,233,.96)),
      url("ticket-bg.png") center / cover no-repeat;
    border: 1px solid rgba(31,111,158,.2);
    border-radius: 24px 24px 16px 16px;
    padding: 72px 20px 26px;
    filter: drop-shadow(0 18px 36px rgba(0,0,0,.35));
  }

  .ticket::before {
    content: "✈  BOARDING PASS";
    position: absolute;
    left: 20px;
    top: 24px;
    right: 72px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(31,111,158,.22);
    color: #1f6f9e;
    font-weight: 850;
    letter-spacing: .9px;
    font-size: 12px;
  }

  .close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    font-size: 28px;
    background: rgba(255,255,255,.94);
  }

  .ticket-title,
  .ticket-section {
    position: static;
    width: auto;
    height: auto;
  }

  .ticket-title {
    margin: 0 0 18px;
    color: #15212d;
    font-size: clamp(23px, 7vw, 30px);
    line-height: 1.12;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    overflow-wrap: anywhere;
  }

  .ticket-section {
    display: block !important;
    margin-top: 15px;
    padding: 12px 0 0;
    border-top: 3px solid #1f6f9e;
  }

  .ticket-section.description {
    margin-top: 0;
  }

  .mobile-label {
    display: block;
    margin-bottom: 9px;
    color: #1f6f9e;
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .8px;
    text-transform: uppercase;
  }

  .ticket-section.description p {
    margin: 0;
    font-size: 14px;
    line-height: 1.48;
    display: block;
    overflow: visible;
    -webkit-line-clamp: unset;
  }

  #projectTech {
    gap: 7px;
  }

  #projectTech li {
    font-size: 12px;
    padding: 6px 10px;
    background: rgba(255,255,255,.85);
  }

  .ticket-section.demo {
    gap: 8px;
  }

  #projectDemo {
    width: 100%;
    gap: 8px;
  }

  .youtube-btn {
    min-height: 44px;
    padding: 10px 13px;
    font-size: 12px;
    border-radius: 10px;
  }
}

/* Small phones */
@media (max-width: 390px) {
  .scene {
    gap: 10px;
    padding-left: 14px;
    padding-right: 14px;
  }

  .suitcase,
  #s1, #s2, #s3, #s4, #s5 {
    height: 64px;
    padding: 0 14px;
  }

  .suitcase::before { font-size: 25px; }
  .suitcase::after { font-size: 14px; }

  .ticket {
    padding-left: 17px;
    padding-right: 17px;
  }

  .youtube-btn {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="scene">
  <div class="overlay"></div>
  <div class="center-text" id="centerText">Pick a bag to see one of my projects</div>

  <div class="suitcase" id="s1" data-title="Split Shores" onclick="openProject(1)" aria-label="Split Shores"></div>
  <div class="suitcase" id="s2" data-title="G4S" onclick="openProject(2)" aria-label="G4S"></div>
  <div class="suitcase" id="s3" data-title="حويتة" onclick="openProject(3)" aria-label="حويتة"></div>
  <div class="suitcase" id="s4" data-title="Zigoocare" onclick="openProject(4)" aria-label="Zigoocare"></div>
  <div class="suitcase" id="s5" data-title="AI Troubleshooting Copilot" onclick="openProject(5)" aria-label="AI Troubleshooting Copilot"></div>

  <button class="back-btn" onclick="goBack()" id="backBtn">← Back</button>
</div>

<!-- FLIGHT TRANSITION -->
<div class="flight-layer" id="flightLayer" aria-hidden="true">
  <div class="flight-shade"></div>
  <svg class="flight-route" aria-hidden="true">
    <path id="flightPath"></path>
  </svg>
  <div class="flight-plane" id="flightPlane" aria-hidden="true">✈</div>
  <div class="flight-destination" id="flightDestination">
    <span id="flightDestinationLabel">Destination</span>
    <strong id="flightDestinationName"></strong>
  </div>
</div>

<!-- PROJECT MODAL -->
<div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectTitle">
  <div class="ticket">
    <span class="close" onclick="closeModal()" aria-label="Close">×</span>

    <div class="ticket-title" id="projectTitle"></div>

    <div class="ticket-section description">
      <span class="mobile-label" id="descriptionLabel">Description</span>
      <p id="projectDescription"></p>
    </div>

    <div class="ticket-section tech">
      <span class="mobile-label" id="techLabel">Technologies used</span>
      <ul id="projectTech"></ul>
    </div>

    <div class="ticket-section demo" id="projectDemoWrap">
      <span class="mobile-label" id="demoLabel">Demo</span>
      <div id="projectDemo"></div>
    </div>
  </div>
</div>

<script>
const currentLang = localStorage.getItem("portfolioLang") || "en";

const uiText = {
  en: {
    center: "Pick a bag to see one of my projects",
    back: "← Back",
    watch: "▶ Watch on YouTube",
    watchVideo: "▶ Watch video",
    description: "Description",
    tech: "Technologies used",
    demo: "Demo",
    destination: "Destination",
    comingTitle: "Coming soon",
    comingDescription: "This project is still being prepared. Check back soon!"
  },
  fr: {
    center: "Choisissez une valise pour découvrir un projet",
    back: "← Retour",
    watch: "▶ Voir sur YouTube",
    watchVideo: "▶ Voir la vidéo",
    description: "Description",
    tech: "Technologies utilisées",
    demo: "Démo",
    destination: "Destination",
    comingTitle: "Bientôt disponible",
    comingDescription: "Ce projet est encore en préparation. Revenez bientôt !"
  }
};

const projects = {
  1: {
    title: "Split Shores",
    description_en: "Split Shores is an adventure video game designed for all ages. Players explore multiple levels with unique environments, enemies and puzzles.",
    description_fr: "Split Shores est un jeu vidéo d’aventure conçu pour tous les âges. Le joueur explore plusieurs niveaux avec des environnements uniques, des ennemis et des énigmes.",
    tech: ["C", "SDL 1.2"],
    video: "https://youtu.be/cb2VBAir7X4?si=txO0yqe4KREmOa_Y"
  },
  2: {
    title: "G4S",
    description_en: "G4S is a social impact streaming platform where streamers, viewers and associations collaborate to fund meaningful projects live.",
    description_fr: "G4S est une plateforme de streaming à impact social où streamers, viewers et associations collaborent pour financer des projets solidaires.",
    tech: ["JavaScript", "HTML5", "CSS", "NodeJS", "Socket.io"],
    video: "https://youtu.be/tgV_ufYuCWc"
  },
  3: {
    title: "حويتة",
    description_en: "Embedded system project for automating the maintenance of an intelligent aquarium.",
    description_fr: "Projet embarqué dédié à l’automatisation de l’entretien d’un aquarium intelligent.",
    tech: ["MikroC", "Proteus ISIS", "MPLAB"],
    videos: [
      "https://youtu.be/wKviLW0Jd-U",
      "https://youtu.be/NaFiM1qbRIk"
    ]
  },
  4: {
    title: "Zigoocare",
    description_en: "Zigoocare is a smart flood prevention and monitoring solution designed to anticipate flooding risks and support municipalities in taking preventive action.",
    description_fr: "Zigoocare est une solution intelligente de prévention et de suivi des inondations, conçue pour anticiper les risques et aider les municipalités à agir de manière préventive.",
    tech: ["C++", "Qt", "Python", "Oracle", "Arduino"],
    video: "https://youtu.be/rbuJg9_fYeA?si=9fEo-da-FAUgr_Ef"
  },
  5: {
    title: "AI Troubleshooting Copilot",
    description_en: "AI assistant for OpenShift that analyzes cluster metrics and logs to identify application issues and suggest corrective actions.",
    description_fr: "Assistant IA pour OpenShift qui analyse les métriques et les logs du cluster afin d’identifier les problèmes applicatifs et de proposer des actions correctives.",
    tech: ["FastAPI", "OpenShift", "Prometheus", "Loki", "Python"],
     video: "https://youtu.be/XltesZ46wbk"
  }
};

const modal = document.getElementById("projectModal");
const centerText = document.getElementById("centerText");
const scene = document.querySelector(".scene");
const flightLayer = document.getElementById("flightLayer");
const flightPlane = document.getElementById("flightPlane");
const flightPath = document.getElementById("flightPath");
const flightDestination = document.getElementById("flightDestination");
const flightDestinationLabel = document.getElementById("flightDestinationLabel");
const flightDestinationName = document.getElementById("flightDestinationName");
let flightBusy = false;

document.getElementById("centerText").innerText = uiText[currentLang].center;
document.getElementById("backBtn").innerText = uiText[currentLang].back;
document.getElementById("descriptionLabel").innerText = uiText[currentLang].description;
document.getElementById("techLabel").innerText = uiText[currentLang].tech;
document.getElementById("demoLabel").innerText = uiText[currentLang].demo;
flightDestinationLabel.innerText = uiText[currentLang].destination;

function openProject(id) {
  if (flightBusy || modal.style.display === "flex") return;

  const p = projects[id];
  const originEl = document.getElementById(`s${id}`);
  const destinationName = p ? p.title : uiText[currentLang].comingTitle;

  runFlightAnimation(originEl, destinationName, () => {
    showProjectModal(id);
  });
}

function showProjectModal(id) {
  centerText.style.opacity = "0";

  const p = projects[id];
  const title = document.getElementById("projectTitle");
  const description = document.getElementById("projectDescription");
  const tech = document.getElementById("projectTech");
  const demo = document.getElementById("projectDemo");
  const demoWrap = document.getElementById("projectDemoWrap");

  tech.innerHTML = "";
  demo.innerHTML = "";
  demoWrap.hidden = true;

  // Fallback placeholder if a future suitcase has no project yet.
  if (!p) {
    title.innerText = uiText[currentLang].comingTitle;
    description.innerText = uiText[currentLang].comingDescription;
    const li = document.createElement("li");
    li.className = "coming-soon";
    li.textContent = "…";
    tech.appendChild(li);
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
    return;
  }

  title.innerText = p.title;
  description.innerText = currentLang === "fr" ? p.description_fr : p.description_en;

  p.tech.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    tech.appendChild(li);
  });

  if (p.videos) {
    p.videos.forEach((v, i) => {
      const a = document.createElement("a");
      a.href = v;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "youtube-btn";
      a.innerText = `${uiText[currentLang].watchVideo} ${i + 1}`;
      demo.appendChild(a);
    });
    demoWrap.hidden = false;
  } else if (p.video) {
    const a = document.createElement("a");
    a.href = p.video;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "youtube-btn";
    a.innerText = uiText[currentLang].watch;
    demo.appendChild(a);
    demoWrap.hidden = false;
  }

  modal.style.display = "flex";
  document.body.style.overflow = "hidden";
}

function runFlightAnimation(originEl, destinationName, onComplete) {
  if (!originEl) {
    onComplete();
    return;
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  flightBusy = true;
  centerText.style.opacity = "0";
  scene.classList.add("flight-active");
  originEl.classList.add("departing");
  document.body.style.overflow = "hidden";

  flightDestinationName.textContent = destinationName;
  flightLayer.classList.add("active");
  flightLayer.setAttribute("aria-hidden", "false");

  if (reduceMotion) {
    /* Keep a short, low-motion transition visible instead of hiding it. */
    flightLayer.classList.add("show-destination");
  }

  const rect = originEl.getBoundingClientRect();
  const mobile = window.matchMedia("(max-width: 768px)").matches;

  const startX = rect.left + rect.width / 2;
  const startY = rect.top + rect.height / 2;

  // Desktop flies toward the upper-right/center. Mobile flies upward toward the destination badge.
  const endX = mobile ? window.innerWidth * 0.50 : window.innerWidth * 0.68;
  const endY = mobile ? Math.max(145, window.innerHeight * 0.20) : Math.max(120, window.innerHeight * 0.22);

  const curveLift = mobile ? 145 : 150;
  const controlX = (startX + endX) / 2 + (mobile ? 72 : 35);
  const controlY = Math.max(70, Math.min(startY, endY) - curveLift);

  const pathD = `M ${startX.toFixed(1)} ${startY.toFixed(1)} Q ${controlX.toFixed(1)} ${controlY.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}`;
  flightPath.setAttribute("d", pathD);

  const routeLength = flightPath.getTotalLength();
  flightPath.style.strokeDasharray = "8 11";
  flightPath.style.strokeDashoffset = String(routeLength);
  flightPath.animate(
    [
      { strokeDashoffset: routeLength, opacity: .18 },
      { strokeDashoffset: 0, opacity: .86 }
    ],
    { duration: 1280, easing: "ease-out", fill: "forwards" }
  );

  const duration = reduceMotion ? 650 : (mobile ? 1450 : 1500);
  const startTime = performance.now();

  function pointOnCurve(t) {
    const mt = 1 - t;
    return {
      x: mt * mt * startX + 2 * mt * t * controlX + t * t * endX,
      y: mt * mt * startY + 2 * mt * t * controlY + t * t * endY
    };
  }

  function tangentOnCurve(t) {
    return {
      x: 2 * (1 - t) * (controlX - startX) + 2 * t * (endX - controlX),
      y: 2 * (1 - t) * (controlY - startY) + 2 * t * (endY - controlY)
    };
  }

  function easeInOut(t) {
    return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function frame(now) {
    const raw = Math.min(1, (now - startTime) / duration);
    const t = easeInOut(raw);
    const point = pointOnCurve(t);
    const tangent = tangentOnCurve(t);
    const angle = Math.atan2(tangent.y, tangent.x) * 180 / Math.PI;

    const fadeIn = Math.min(1, raw / .12);
    const fadeOut = raw > .88 ? Math.max(0, (1 - raw) / .12) : 1;
    const opacity = Math.min(fadeIn, fadeOut);
    const scale = .78 + Math.sin(Math.PI * raw) * .28;

    flightPlane.style.left = `${point.x}px`;
    flightPlane.style.top = `${point.y}px`;
    flightPlane.style.opacity = opacity.toFixed(3);
    flightPlane.style.transform = `translate(-50%, -50%) rotate(${angle.toFixed(1)}deg) scale(${scale.toFixed(3)})`;

    if (raw > .58) {
      flightLayer.classList.add("show-destination");
    }

    if (raw < 1) {
      requestAnimationFrame(frame);
    } else {
      setTimeout(() => finishFlight(originEl, onComplete), 180);
    }
  }

  requestAnimationFrame(frame);
}

function finishFlight(originEl, onComplete) {
  flightLayer.classList.remove("show-destination");
  flightPlane.style.opacity = "0";

  setTimeout(() => {
    flightLayer.classList.remove("active");
    flightLayer.setAttribute("aria-hidden", "true");
    scene.classList.remove("flight-active");
    originEl.classList.remove("departing");
    flightBusy = false;
    onComplete();
  }, 170);
}

function closeModal() {
  modal.style.display = "none";
  flightLayer.classList.remove("active", "show-destination");
  scene.classList.remove("flight-active");
  document.querySelectorAll(".suitcase.departing").forEach(el => el.classList.remove("departing"));
  flightBusy = false;
  centerText.style.opacity = "1";
  document.body.style.overflow = "";
}

function goBack() {
  window.location.href = "index.html";
}

// Close when clicking outside the ticket.
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

// Close with Escape.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.style.display === "flex") closeModal();
});
</script>
